version: '3.9'

services: 
  franco:
    image: ghcr.io/isfran2305/proyecto3.0.0:latest   
    networks: 
      - traefik-public
    deploy: 
      replicas: 1
      update_config:
       parallelism: 1
       delay: 10s
      restart_policy:
       condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.franco.entrypoints=http"
        - "traefik.http.routers.franco.rule=Host(`franco.byronrm.com`)"
        - "traefik.http.middlewares.franco-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.routers.franco.middlewares=franco-https-redirect"
        - "traefik.http.routers.franco-secure.entrypoints=https"
        - "traefik.http.routers.franco-secure.rule=Host(`franco.byronrm.com`)"
        - "traefik.http.routers.franco-secure.tls=true"
        - "traefik.http.routers.franco-secure.tls.certresolver=http"
        - "traefik.http.routers.franco-secure.service=franco"
        - "traefik.http.services.franco.loadbalancer.server.port=5000"
        - "traefik.docker.network=traefik-public"

networks:
  traefik-public:
   external: true